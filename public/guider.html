<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guider – Energiknatte</title>
  <link rel="stylesheet" href="/style.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4447589580139887" crossorigin="anonymous"></script>
</head>
<body>
  <main class="info-page">
    <div class="page-toolbar">
      <div class="language-switch" aria-label="Language selector">
        <button id="lang-sv" class="lang-btn" type="button" aria-label="Svenska" aria-pressed="true">🇸🇪</button>
        <button id="lang-en" class="lang-btn" type="button" aria-label="English" aria-pressed="false">🇬🇧</button>
      </div>
      <a id="back-link" class="back-link" href="/">Tillbaka</a>
    </div>
    <h1 id="page-heading">Guider</h1>
    <p id="page-description">Praktiska guider som hjälper dig använda Energiknatte i vardagen.</p>

    <section>
      <h2 id="guides-heading">Aktuella guider</h2>
      <div id="guides-list"></div>
    </section>
  </main>

  <script>
    const LANGUAGE_KEY = 'siteLanguage';
    const guidesList = document.getElementById('guides-list');
    const langSvBtn = document.getElementById('lang-sv');
    const langEnBtn = document.getElementById('lang-en');

    const translations = {
      sv: {
        pageTitle: 'Guider – Energiknatte',
        backLink: 'Tillbaka',
        heading: 'Guider',
        description: 'Praktiska guider som hjälper dig använda Energiknatte i vardagen.',
        guidesHeading: 'Aktuella guider',
        empty: 'Inga guider publicerade ännu.',
        loadError: 'Kunde inte ladda guider just nu.',
        fetchError: 'Kunde inte hämta guider',
        fallbackTitle: 'Guide',
        readMore: 'Läs guide',
      },
      en: {
        pageTitle: 'Guides – Energiknatte',
        backLink: 'Back',
        heading: 'Guides',
        description: 'Practical guides to help you use Energiknatte in everyday life.',
        guidesHeading: 'Current guides',
        empty: 'No guides have been published yet.',
        loadError: 'Could not load guides right now.',
        fetchError: 'Could not fetch guides',
        fallbackTitle: 'Guide',
        readMore: 'Read guide',
      },
    };

    let language = 'sv';

    function t(key) {
      return translations[language][key] || translations.sv[key] || key;
    }

    function applyTranslations() {
      document.documentElement.lang = language;
      document.title = t('pageTitle');
      document.getElementById('back-link').textContent = t('backLink');
      document.getElementById('page-heading').textContent = t('heading');
      document.getElementById('page-description').textContent = t('description');
      document.getElementById('guides-heading').textContent = t('guidesHeading');
      langSvBtn.setAttribute('aria-pressed', String(language === 'sv'));
      langEnBtn.setAttribute('aria-pressed', String(language === 'en'));
      langSvBtn.textContent = '🇸🇪';
      langEnBtn.textContent = '🇬🇧';
    }

    const formatDate = value => {
      const d = new Date(value);
      return Number.isNaN(d.getTime())
        ? ''
        : d.toLocaleDateString(language === 'en' ? 'en-US' : 'sv-SE', { year: 'numeric', month: 'long', day: 'numeric' });
    };

    const slugify = (value = '') => String(value)
      .normalize('NFKD')
      .toLowerCase()
      .replace(/[^a-z0-9\s-]/g, '')
      .trim()
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');

    function attachSlugs(items) {
      const usedSlugs = new Set();
      return items.map((item, index) => {
        const baseSlug = slugify(item.title) || slugify(item.id) || `guide-${index + 1}`;
        let slug = baseSlug;
        let i = 2;

        while (usedSlugs.has(slug)) {
          slug = `${baseSlug}-${i}`;
          i += 1;
        }

        usedSlugs.add(slug);
        return { ...item, slug };
      });
    }

    function render(items) {
      guidesList.innerHTML = '';
      if (!items.length) {
        guidesList.innerHTML = `<p>${t('empty')}</p>`;
        return;
      }

      const fragment = document.createDocumentFragment();
      items.forEach(item => {
        const article = document.createElement('article');
        article.className = 'news-item';

        const h3 = document.createElement('h3');
        h3.textContent = item.title || t('fallbackTitle');
        article.appendChild(h3);

        const dateText = formatDate(item.createdAt);
        if (dateText) {
          const date = document.createElement('p');
          date.className = 'news-date';
          date.textContent = dateText;
          article.appendChild(date);
        }

        const preview = document.createElement('p');
        preview.textContent = (item.content || '').slice(0, 180) + ((item.content || '').length > 180 ? '…' : '');
        article.appendChild(preview);

        if (item.id) {
          const link = document.createElement('a');
          link.className = 'top-link-btn';
          link.href = item.slug ? `/guider/${item.slug}.html` : `/guide.html?id=${encodeURIComponent(item.id)}`;
          link.textContent = t('readMore');
          article.appendChild(link);
        }

        fragment.appendChild(article);
      });
      guidesList.appendChild(fragment);
    }

    function setLanguage(nextLanguage) {
      if (!translations[nextLanguage]) {
        return;
      }
      language = nextLanguage;
      try {
        localStorage.setItem(LANGUAGE_KEY, language);
      } catch (_error) {
        // ignore
      }
      applyTranslations();
      if (Array.isArray(window.guideItems)) {
        render(window.guideItems);
      }
    }

    async function loadGuides() {
      try {
        const res = await fetch('/api/guides');
        if (!res.ok) throw new Error(t('fetchError'));
        const items = await res.json();
        window.guideItems = items;
        render(items);
      } catch (_error) {
        try {
          const staticRes = await fetch('/guides.json');
          if (!staticRes.ok) throw new Error(t('fetchError'));
          const items = attachSlugs(await staticRes.json());
          window.guideItems = items;
          render(items);
        } catch (_fallbackError) {
          guidesList.innerHTML = `<p>${t('loadError')}</p>`;
        }
      }
    }

    try {
      const storedLanguage = localStorage.getItem(LANGUAGE_KEY);
      if (storedLanguage && translations[storedLanguage]) {
        language = storedLanguage;
      }
    } catch (_error) {
      language = 'sv';
    }

    langSvBtn.addEventListener('click', () => setLanguage('sv'));
    langEnBtn.addEventListener('click', () => setLanguage('en'));

    applyTranslations();
    loadGuides();
  </script>
</body>
</html>
