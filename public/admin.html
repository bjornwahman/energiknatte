<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Inställningar</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      background: radial-gradient(circle at top, #2a165a, #05060f 70%);
      color: #fff;
      font-family: 'Outfit', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: 2rem;
    }
    .admin-panel { width: min(1200px, 100%); margin: 0 auto; }
    .admin-header { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
    .home-button { text-decoration:none; color:#13072e; background:linear-gradient(120deg,#ffbe0b,#ff78c4); padding:0.6rem 1rem; border-radius:999px; font-weight:700; }
    .settings-menu { display:flex; flex-wrap:wrap; gap:0.6rem; margin:1.2rem 0 1.5rem; }
    .settings-menu button { border:none; border-radius:999px; padding:0.6rem 1rem; background:rgba(255,255,255,0.15); color:#fff; cursor:pointer; }
    .settings-menu button.is-active { background:linear-gradient(120deg,#7fe7dc,#4f7cff); color:#051022; font-weight:700; }
    .section { display:none; }
    .section.is-active { display:grid; gap:1.2rem; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); }
    .admin-card { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); border-radius:18px; padding:1.2rem; }
    form label { display:flex; flex-direction:column; gap:0.35rem; margin-bottom:0.8rem; font-weight:600; }
    form input, form textarea { border:1px solid rgba(255,255,255,0.25); background:rgba(8,10,22,0.9); color:#fff; border-radius:10px; padding:0.6rem 0.8rem; font:inherit; }
    form textarea { min-height:90px; resize:vertical; }
    form button, .restart-button { border:none; border-radius:999px; padding:0.8rem 1rem; cursor:pointer; font-weight:700; }
    form button { background:linear-gradient(120deg,#7fe7dc,#4f7cff); color:#061026; }
    .restart-button { background:linear-gradient(120deg,#ff9f1c,#ff4d6d); color:#fff; }
    .list { display:flex; flex-direction:column; gap:0.7rem; max-height:460px; overflow:auto; }
    .row { border:1px solid rgba(255,255,255,0.2); border-radius:12px; padding:0.7rem 0.9rem; display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; }
    .row button { border:none; border-radius:999px; background:rgba(255,77,109,0.2); color:#ff8ca0; padding:0.4rem 0.8rem; cursor:pointer; }
    .meta { color:#d2d0ff; font-size:0.9rem; }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4447589580139887" crossorigin="anonymous"></script>
</head>
<body>
  <main class="admin-panel">
    <header class="admin-header">
      <h1>Admin · Inställningar</h1>
      <a class="home-button" href="/">← Till huvudsidan</a>
    </header>

    <nav class="settings-menu" aria-label="Inställningsmeny">
      <button data-section="recipes" class="is-active" type="button">Recept</button>
      <button data-section="news" type="button">Nyheter</button>
      <button data-section="guides" type="button">Guider</button>
      <button data-section="links" type="button">Länkar</button>
      <button data-section="webapp" type="button">Webapp</button>
    </nav>

    <section id="section-recipes" class="section is-active">
      <form id="create-form" class="admin-card">
        <h2>Lägg till recept</h2>
        <label>Namn<input name="name" required /></label>
        <label>Energi<input name="energy" required /></label>
        <label>Boost<input name="boost" required /></label>
        <label>Tid<input name="time" required /></label>
        <label>Typ<input name="kind" required /></label>
        <label>Färg<input name="color" value="#ffbe0b" required /></label>
        <label>Mood(s)<input name="moods" placeholder="sött,crunch" required /></label>
        <label>Ingredienser (en per rad)<textarea name="ingredients" required></textarea></label>
        <label>Instruktioner (en per rad)<textarea name="instructions" required></textarea></label>
        <input type="hidden" name="originalName" />
        <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
          <button id="save-new-btn" type="submit">Spara som nytt</button>
          <button id="save-edit-btn" type="button" style="display:none;">Spara ändringar</button>
          <button id="cancel-edit-btn" type="button" style="display:none; background:rgba(255,255,255,0.2); color:#fff;">Avbryt redigering</button>
        </div>
        <p id="form-status"></p>
      </form>
      <div class="admin-card"><h2>Befintliga recept</h2><div id="recipes" class="list"></div></div>
    </section>

    <section id="section-news" class="section">
      <form id="news-form" class="admin-card">
        <h2>Publicera nyhet</h2>
        <label>Titel<input name="title" required /></label>
        <label>Innehåll<textarea name="content" required></textarea></label>
        <button type="submit">Publicera nyhet</button><p id="news-status"></p>
      </form>
      <div class="admin-card"><h2>Publicerade nyheter</h2><div id="news-list" class="list"></div></div>
    </section>

    <section id="section-guides" class="section">
      <form id="guides-form" class="admin-card">
        <h2>Publicera guide</h2>
        <label>Titel<input name="title" required /></label>
        <label>Innehåll<textarea name="content" required></textarea></label>
        <button type="submit">Publicera guide</button><p id="guides-status"></p>
      </form>
      <div class="admin-card"><h2>Publicerade guider</h2><div id="guides-list" class="list"></div></div>
    </section>

    <section id="section-links" class="section">
      <form id="links-form" class="admin-card">
        <h2>Publicera länk</h2>
        <label>Titel<input name="title" required /></label>
        <label>URL<input name="url" placeholder="https://..." required /></label>
        <label>Beskrivning<textarea name="description"></textarea></label>
        <button type="submit">Publicera länk</button><p id="links-status"></p>
      </form>
      <div class="admin-card"><h2>Publicerade länkar</h2><div id="links-list" class="list"></div></div>
    </section>

    <section id="section-webapp" class="section">
      <div class="admin-card">
        <h2>Webapp</h2>
        <p>Starta om servern om du behöver ladda om appen efter ändringar.</p>
        <button id="restart-app" type="button" class="restart-button">Starta om webappen</button>
        <p id="restart-status"></p>
      </div>
    </section>
  </main>

  <script>
    const splitLines = value => value.split('\n').map(line => line.trim()).filter(Boolean);
    const menuButtons = [...document.querySelectorAll('.settings-menu button')];
    const sections = {
      recipes: document.getElementById('section-recipes'),
      news: document.getElementById('section-news'),
      guides: document.getElementById('section-guides'),
      links: document.getElementById('section-links'),
      webapp: document.getElementById('section-webapp')
    };

    menuButtons.forEach(button => {
      button.addEventListener('click', () => {
        menuButtons.forEach(btn => btn.classList.toggle('is-active', btn === button));
        Object.entries(sections).forEach(([key, section]) => section.classList.toggle('is-active', key === button.dataset.section));
      });
    });

    const form = document.getElementById('create-form');
    const recipesEl = document.getElementById('recipes');
    const statusEl = document.getElementById('form-status');

    const newsForm = document.getElementById('news-form');
    const newsStatus = document.getElementById('news-status');
    const newsList = document.getElementById('news-list');

    const guidesForm = document.getElementById('guides-form');
    const guidesStatus = document.getElementById('guides-status');
    const guidesList = document.getElementById('guides-list');

    const linksForm = document.getElementById('links-form');
    const linksStatus = document.getElementById('links-status');
    const linksList = document.getElementById('links-list');

    const restartButton = document.getElementById('restart-app');
    const restartStatus = document.getElementById('restart-status');

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('sv-SE', { dateStyle: 'medium', timeStyle: 'short' });
    }

    function renderEntityList(container, items, { getTitle, getMeta, getBody, actions }) {
      container.innerHTML = '';
      if (!items.length) {
        container.innerHTML = '<p>Inga poster ännu.</p>';
        return;
      }
      const fragment = document.createDocumentFragment();
      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'row';

        const details = document.createElement('div');
        const title = document.createElement('strong');
        title.textContent = getTitle(item);
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = getMeta(item);
        details.append(title, document.createElement('br'), meta);

        const body = getBody(item);
        if (body) {
          const p = document.createElement('p');
          p.textContent = body;
          p.style.margin = '0.45rem 0 0';
          details.appendChild(p);
        }

        const buttonWrap = document.createElement('div');
        buttonWrap.style.display = 'flex';
        buttonWrap.style.gap = '0.4rem';

        actions.forEach(action => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = action.label;
          if (action.variant === 'edit') {
            button.style.background = 'rgba(127,231,220,0.2)';
            button.style.color = '#7fe7dc';
          }
          button.setAttribute(action.attr, action.value(item));
          buttonWrap.appendChild(button);
        });

        row.append(details, buttonWrap);
        fragment.appendChild(row);
      });
      container.appendChild(fragment);
    }

    function setRecipeFormMode(mode, snack = null) {
      const saveEditBtn = document.getElementById('save-edit-btn');
      const cancelEditBtn = document.getElementById('cancel-edit-btn');
      const saveNewBtn = document.getElementById('save-new-btn');
      const originalNameInput = form.elements.originalName;

      if (mode === 'edit' && snack) {
        form.elements.name.value = snack.name || '';
        form.elements.energy.value = snack.energy || '';
        form.elements.boost.value = snack.boost || '';
        form.elements.time.value = snack.time || '';
        form.elements.kind.value = snack.kind || '';
        form.elements.color.value = snack.color || '#ffbe0b';
        form.elements.moods.value = (snack.moods || []).join(',');
        form.elements.ingredients.value = (snack.ingredients || []).join('\n');
        form.elements.instructions.value = (snack.instructions || []).join('\n');
        originalNameInput.value = snack.name || '';
        saveEditBtn.style.display = 'inline-block';
        cancelEditBtn.style.display = 'inline-block';
        saveNewBtn.textContent = 'Spara som nytt';
        statusEl.textContent = `Redigerar: ${snack.name}`;
      } else {
        form.reset();
        form.elements.color.value = '#ffbe0b';
        originalNameInput.value = '';
        saveEditBtn.style.display = 'none';
        cancelEditBtn.style.display = 'none';
        saveNewBtn.textContent = 'Spara som nytt';
      }
    }

    function buildSnackPayload(sourceForm) {
      return {
        name: sourceForm.get('name').trim(),
        energy: sourceForm.get('energy').trim(),
        boost: sourceForm.get('boost').trim(),
        time: sourceForm.get('time').trim(),
        kind: sourceForm.get('kind').trim(),
        color: sourceForm.get('color').trim(),
        moods: sourceForm.get('moods').split(',').map(v => v.trim()).filter(Boolean),
        ingredients: splitLines(sourceForm.get('ingredients')),
        instructions: splitLines(sourceForm.get('instructions'))
      };
    }

    async function saveRecipeAsNew() {
      statusEl.textContent = 'Sparar nytt recept...';
      const payload = buildSnackPayload(new FormData(form));
      const res = await fetch('/api/snacks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!res.ok) {
        statusEl.textContent = (await res.json().catch(() => ({}))).error || 'Kunde inte spara receptet';
        return;
      }
      setRecipeFormMode('new');
      statusEl.textContent = 'Receptet sparades som nytt!';
      await loadSnacks();
    }

    async function saveRecipeEdit() {
      const originalName = form.elements.originalName.value;
      if (!originalName) {
        statusEl.textContent = 'Välj ett recept att redigera först.';
        return;
      }
      statusEl.textContent = 'Sparar ändringar...';
      const payload = buildSnackPayload(new FormData(form));
      const res = await fetch(`/api/snacks/${encodeURIComponent(originalName)}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!res.ok) {
        statusEl.textContent = (await res.json().catch(() => ({}))).error || 'Kunde inte spara ändringar';
        return;
      }
      setRecipeFormMode('new');
      statusEl.textContent = 'Ändringarna sparades!';
      await loadSnacks();
    }

async function loadSnacks() {
      const snacks = await (await fetch('/api/snacks')).json();
      renderEntityList(recipesEl, snacks, {
        getTitle: item => item.name,
        getMeta: item => `${item.time} · ${item.energy}`,
        getBody: item => item.boost,
        actions: [
          { label: 'Redigera', attr: 'data-snack-edit', value: item => item.name, variant: 'edit' },
          { label: 'Ta bort', attr: 'data-snack-name', value: item => item.name }
        ]
      });
    }

    async function loadNews() {
      const items = await (await fetch('/api/news')).json();
      renderEntityList(newsList, items, {
        getTitle: item => item.title,
        getMeta: item => formatDate(item.createdAt),
        getBody: item => item.content,
        actions: [{ label: 'Ta bort', attr: 'data-news-id', value: item => item.id }]
      });
    }

    async function loadGuides() {
      const items = await (await fetch('/api/guides')).json();
      renderEntityList(guidesList, items, {
        getTitle: item => item.title,
        getMeta: item => formatDate(item.createdAt),
        getBody: item => item.content,
        actions: [{ label: 'Ta bort', attr: 'data-guide-id', value: item => item.id }]
      });
    }

    async function loadLinks() {
      const items = await (await fetch('/api/links')).json();
      renderEntityList(linksList, items, {
        getTitle: item => item.title,
        getMeta: item => item.url,
        getBody: item => item.description,
        actions: [{ label: 'Ta bort', attr: 'data-link-id', value: item => item.id }]
      });
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      await saveRecipeAsNew();
    });


    document.getElementById('save-edit-btn').addEventListener('click', async () => {
      await saveRecipeEdit();
    });

    document.getElementById('cancel-edit-btn').addEventListener('click', () => {
      setRecipeFormMode('new');
      statusEl.textContent = 'Redigering avbruten.';
    });

    newsForm.addEventListener('submit', async event => {
      event.preventDefault();
      newsStatus.textContent = 'Publicerar...';
      const formData = new FormData(newsForm);
      const res = await fetch('/api/news', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: String(formData.get('title')||'').trim(), content: String(formData.get('content')||'').trim() }) });
      if (!res.ok) {
        newsStatus.textContent = (await res.json().catch(() => ({}))).error || 'Kunde inte publicera nyhet';
        return;
      }
      newsForm.reset();
      newsStatus.textContent = 'Nyheten är publicerad!';
      await loadNews();
    });

    guidesForm.addEventListener('submit', async event => {
      event.preventDefault();
      guidesStatus.textContent = 'Publicerar...';
      const formData = new FormData(guidesForm);
      const res = await fetch('/api/guides', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: String(formData.get('title')||'').trim(), content: String(formData.get('content')||'').trim() }) });
      if (!res.ok) {
        guidesStatus.textContent = (await res.json().catch(() => ({}))).error || 'Kunde inte publicera guide';
        return;
      }
      guidesForm.reset();
      guidesStatus.textContent = 'Guiden är publicerad!';
      await loadGuides();
    });

    linksForm.addEventListener('submit', async event => {
      event.preventDefault();
      linksStatus.textContent = 'Publicerar...';
      const formData = new FormData(linksForm);
      const res = await fetch('/api/links', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: String(formData.get('title')||'').trim(), url: String(formData.get('url')||'').trim(), description: String(formData.get('description')||'').trim() }) });
      if (!res.ok) {
        linksStatus.textContent = (await res.json().catch(() => ({}))).error || 'Kunde inte publicera länk';
        return;
      }
      linksForm.reset();
      linksStatus.textContent = 'Länken är publicerad!';
      await loadLinks();
    });

    document.body.addEventListener('click', async event => {
      const editSnack = event.target.closest('button[data-snack-edit]');
      if (editSnack) {
        const snacks = await (await fetch('/api/snacks')).json();
        const selected = snacks.find(item => item.name === editSnack.dataset.snackEdit);
        if (selected) {
          setRecipeFormMode('edit', selected);
        }
      }

      const snack = event.target.closest('button[data-snack-name]');
      if (snack && confirm('Ta bort detta recept?')) {
        await fetch(`/api/snacks/${encodeURIComponent(snack.dataset.snackName)}`, { method: 'DELETE' });
        await loadSnacks();
      }

      const news = event.target.closest('button[data-news-id]');
      if (news && confirm('Ta bort den här nyheten?')) {
        await fetch(`/api/news/${encodeURIComponent(news.dataset.newsId)}`, { method: 'DELETE' });
        await loadNews();
      }

      const guide = event.target.closest('button[data-guide-id]');
      if (guide && confirm('Ta bort den här guiden?')) {
        await fetch(`/api/guides/${encodeURIComponent(guide.dataset.guideId)}`, { method: 'DELETE' });
        await loadGuides();
      }

      const link = event.target.closest('button[data-link-id]');
      if (link && confirm('Ta bort den här länken?')) {
        await fetch(`/api/links/${encodeURIComponent(link.dataset.linkId)}`, { method: 'DELETE' });
        await loadLinks();
      }
    });

    async function waitForServerToRestart({ retries = 20, intervalMs = 1500 } = {}) {
      for (let attempt = 1; attempt <= retries; attempt += 1) {
        try {
          const health = await fetch('/health', { cache: 'no-store' });
          if (health.ok) return true;
        } catch (_error) {}
        await new Promise(resolve => setTimeout(resolve, intervalMs));
      }
      return false;
    }

    restartButton.addEventListener('click', async () => {
      restartButton.disabled = true;
      restartStatus.textContent = 'Skickar omstarts-signal...';
      try {
        await fetch('/api/admin/restart', { method: 'POST' });
        restartStatus.textContent = 'Servern startar om...';
      } catch (error) {
        restartStatus.textContent = `Omstart initierad (${error.message}). Väntar på servern...`;
      }
      const isBack = await waitForServerToRestart();
      restartButton.disabled = false;
      restartStatus.textContent = isBack ? 'Webappen är igång igen ✅' : 'Servern är fortfarande nere. Försök igen.';
    });

    setRecipeFormMode('new');
    loadSnacks();
    loadNews();
    loadGuides();
    loadLinks();
  </script>
</body>
</html>
