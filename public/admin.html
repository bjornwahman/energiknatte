<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Recept & Nyheter</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      background: radial-gradient(circle at top, #2a165a, #05060f 70%);
      color: #fff;
      font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem;
    }
    .admin-panel {
      width: min(1100px, 100%);
    }
    .admin-panel h1 {
      margin-top: 0;
      font-family: 'Fredoka', sans-serif;
    }
    .admin-grid {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
    .admin-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 20px 60px rgba(5, 10, 20, 0.4);
    }
    .admin-card h2 {
      margin-top: 0;
      font-family: 'Fredoka', sans-serif;
    }
    form label {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    form input, form textarea {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(7, 9, 18, 0.9);
      color: inherit;
      font: inherit;
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
    }
    form textarea {
      min-height: 90px;
      resize: vertical;
    }
    form button {
      border: none;
      padding: 0.9rem 1.2rem;
      border-radius: 999px;
      background: linear-gradient(120deg, #7fe7dc, #4f7cff);
      color: #061026;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    #recipes {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 520px;
      overflow: auto;
    }
    .recipe-row {
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.02);
    }
    .recipe-row button {
      border: none;
      border-radius: 999px;
      background: rgba(255, 77, 109, 0.15);
      color: #ff4d6d;
      padding: 0.4rem 1rem;
      cursor: pointer;
    }
    .restart-button {
      border: none;
      padding: 0.9rem 1.2rem;
      border-radius: 999px;
      background: linear-gradient(120deg, #ff9f1c, #ff4d6d);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5657975552241199" crossorigin="anonymous"></script>
</head>
<body>
  <main class="admin-panel">
    <h1>Admin · Recept & Nyheter</h1>
    <section class="admin-grid">
      <form id="create-form" class="admin-card">
        <h2>Lägg till recept</h2>
        <label>Namn<input name="name" required /></label>
        <label>Energi (t.ex. 340 kcal)<input name="energy" required /></label>
        <label>Boost<input name="boost" required /></label>
        <label>Tid<input name="time" required /></label>
        <label>Typ (quick/batch)<input name="kind" required /></label>
        <label>Färg (t.ex. #ffbe0b)<input name="color" value="#ffbe0b" required /></label>
        <label>Mood(s) – kommaseparerat<input name="moods" placeholder="sött,crunch" required /></label>
        <label>Ingredienser (en per rad)<textarea name="ingredients" required></textarea></label>
        <label>Instruktioner (en per rad)<textarea name="instructions" required></textarea></label>
        <button type="submit">Spara recept</button>
        <p id="form-status"></p>
      </form>
      <div class="admin-card">
        <h2>Befintliga recept</h2>
        <div id="recipes"></div>
      </div>

      <form id="news-form" class="admin-card">
        <h2>Publicera nyhet</h2>
        <label>Titel<input name="title" required /></label>
        <label>Innehåll<textarea name="content" required></textarea></label>
        <button type="submit">Publicera nyhet</button>
        <p id="news-status"></p>
      </form>
      <div class="admin-card">
        <h2>Publicerade nyheter</h2>
        <div id="news-list"></div>
      </div>
      <div class="admin-card">
        <h2>Webapp</h2>
        <p>Starta om servern om du behöver ladda om appen efter ändringar.</p>
        <button id="restart-app" type="button" class="restart-button">Starta om webappen</button>
        <p id="restart-status"></p>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('create-form');
    const recipesEl = document.getElementById('recipes');
    const statusEl = document.getElementById('form-status');
    const restartButton = document.getElementById('restart-app');
    const restartStatus = document.getElementById('restart-status');
    const newsForm = document.getElementById('news-form');
    const newsStatus = document.getElementById('news-status');
    const newsList = document.getElementById('news-list');
    let snacks = [];
    let news = [];

    const splitLines = value => value.split('\n').map(line => line.trim()).filter(Boolean);

    async function loadSnacks() {
      const res = await fetch('/api/snacks');
      snacks = await res.json();
      renderList();
    }


    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return '';
      }
      return date.toLocaleString('sv-SE', { dateStyle: 'medium', timeStyle: 'short' });
    }

    async function loadNews() {
      const res = await fetch('/api/news');
      news = await res.json();
      renderNews();
    }

    function renderNews() {
      newsList.innerHTML = '';

      if (!news.length) {
        newsList.innerHTML = '<p>Inga nyheter ännu.</p>';
        return;
      }

      const fragment = document.createDocumentFragment();

      news.forEach(item => {
        const row = document.createElement('div');
        row.className = 'recipe-row';

        const details = document.createElement('div');
        const title = document.createElement('strong');
        title.textContent = item.title;
        const meta = document.createElement('small');
        meta.textContent = formatDate(item.createdAt);
        const text = document.createElement('p');
        text.textContent = item.content;
        text.style.margin = '0.5rem 0 0';
        details.append(title, document.createElement('br'), meta, text);

        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.newsId = item.id;
        button.textContent = 'Ta bort';

        row.append(details, button);
        fragment.appendChild(row);
      });

      newsList.appendChild(fragment);
    }

    function renderList() {
      recipesEl.innerHTML = '';

      if (!snacks.length) {
        recipesEl.innerHTML = '<p>Inga recept ännu.</p>';
        return;
      }

      const fragment = document.createDocumentFragment();

      snacks.forEach(snack => {
        const row = document.createElement('div');
        row.className = 'recipe-row';

        const details = document.createElement('div');
        const title = document.createElement('strong');
        title.textContent = snack.name;
        const meta = document.createElement('small');
        meta.textContent = `${snack.time} · ${snack.energy}`;
        details.append(title, document.createElement('br'), meta);

        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.name = snack.name;
        button.textContent = 'Ta bort';

        row.append(details, button);
        fragment.appendChild(row);
      });

      recipesEl.appendChild(fragment);
    }

    recipesEl.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-name]');
      if (!button) return;
      const name = button.dataset.name;
      if (!confirm('Ta bort detta recept?')) return;
      const res = await fetch(`/api/snacks/${encodeURIComponent(name)}`, { method: 'DELETE' });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert(data.error || 'Kunde inte ta bort recept');
        return;
      }
      await loadSnacks();
    });


    newsList.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-news-id]');
      if (!button) return;
      if (!confirm('Ta bort den här nyheten?')) return;

      const res = await fetch(`/api/news/${encodeURIComponent(button.dataset.newsId)}`, {
        method: 'DELETE'
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert(data.error || 'Kunde inte ta bort nyheten');
        return;
      }

      await loadNews();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusEl.textContent = 'Sparar...';
      const formData = new FormData(form);
      const payload = {
        name: formData.get('name').trim(),
        energy: formData.get('energy').trim(),
        boost: formData.get('boost').trim(),
        time: formData.get('time').trim(),
        kind: formData.get('kind').trim(),
        color: formData.get('color').trim(),
        moods: formData.get('moods').split(',').map(v => v.trim()).filter(Boolean),
        ingredients: splitLines(formData.get('ingredients')),
        instructions: splitLines(formData.get('instructions'))
      };

      const res = await fetch('/api/snacks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        statusEl.textContent = data.error || 'Kunde inte spara receptet';
        return;
      }

      form.reset();
      statusEl.textContent = 'Receptet sparades!';
      await loadSnacks();
    });


    newsForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      newsStatus.textContent = 'Publicerar...';
      const formData = new FormData(newsForm);
      const payload = {
        title: String(formData.get('title') || '').trim(),
        content: String(formData.get('content') || '').trim()
      };

      const res = await fetch('/api/news', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        newsStatus.textContent = data.error || 'Kunde inte publicera nyheten';
        return;
      }

      newsForm.reset();
      newsStatus.textContent = 'Nyheten är publicerad!';
      await loadNews();
    });

    async function waitForServerToRestart({ retries = 20, intervalMs = 1500 } = {}) {
      for (let attempt = 1; attempt <= retries; attempt += 1) {
        try {
          const health = await fetch('/health', { cache: 'no-store' });
          if (health.ok) {
            return true;
          }
        } catch (_error) {
          // Förväntat medan servern är nere under omstart.
        }

        await new Promise(resolve => setTimeout(resolve, intervalMs));
      }

      return false;
    }

    restartButton.addEventListener('click', async () => {
      restartButton.disabled = true;
      restartStatus.textContent = 'Skickar omstarts-signal...';

      try {
        const res = await fetch('/api/admin/restart', { method: 'POST' });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Kunde inte starta om appen');
        }
        restartStatus.textContent = 'Servern startar om... väntar på att den kommer upp igen.';
      } catch (error) {
        // Om anslutningen bryts direkt efter signalen är det oftast ett tecken på att omstarten faktiskt startade.
        restartStatus.textContent = `Omstart initierad (${error.message}). Väntar på servern...`;
      }

      const isBack = await waitForServerToRestart();
      restartButton.disabled = false;
      restartStatus.textContent = isBack
        ? 'Webappen är igång igen ✅'
        : 'Servern är fortfarande nere. Vänta lite och försök igen.';
    });

    loadSnacks();
    loadNews();
  </script>
</body>
</html>
