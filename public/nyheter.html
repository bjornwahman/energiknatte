<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyheter – Energiknatte</title>
  <link rel="stylesheet" href="/style.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4447589580139887" crossorigin="anonymous"></script>
</head>
<body>
  <main class="info-page">
    <div class="page-toolbar">
      <div class="language-switch" aria-label="Language selector">
        <button id="lang-sv" class="lang-btn" type="button" aria-label="Svenska" aria-pressed="true">🇸🇪</button>
        <button id="lang-en" class="lang-btn" type="button" aria-label="English" aria-pressed="false">🇬🇧</button>
      </div>
      <a id="back-link" class="back-link" href="/">Tillbaka</a>
    </div>
    <h1 id="page-heading">Nyheter</h1>
    <p id="page-description">Här samlar vi nyheter om Energiknatte, nya recept och förbättringar i tjänsten.</p>

    <section>
      <h2 id="updates-heading">Senaste uppdateringar</h2>
      <div id="news-list"></div>
    </section>
  </main>

  <script>
    const LANGUAGE_KEY = 'siteLanguage';
    const newsList = document.getElementById('news-list');
    const langSvBtn = document.getElementById('lang-sv');
    const langEnBtn = document.getElementById('lang-en');

    const translations = {
      sv: {
        pageTitle: 'Nyheter – Energiknatte',
        backLink: 'Tillbaka',
        heading: 'Nyheter',
        description: 'Här samlar vi nyheter om Energiknatte, nya recept och förbättringar i tjänsten.',
        updates: 'Senaste uppdateringar',
        empty: 'Inga nyheter publicerade ännu.',
        loadError: 'Kunde inte ladda nyheter just nu.',
        fetchError: 'Kunde inte hämta nyheter',
        fallbackTitle: 'Nyhet',
      },
      en: {
        pageTitle: 'News – Energiknatte',
        backLink: 'Back',
        heading: 'News',
        description: 'Here we share updates about Energiknatte, new recipes, and improvements to the service.',
        updates: 'Latest updates',
        empty: 'No news has been published yet.',
        loadError: 'Could not load news right now.',
        fetchError: 'Could not fetch news',
        fallbackTitle: 'News item',
      },
    };

    let language = 'sv';

    function t(key) {
      return translations[language][key] || translations.sv[key] || key;
    }

    function applyTranslations() {
      document.documentElement.lang = language;
      document.title = t('pageTitle');
      document.getElementById('back-link').textContent = t('backLink');
      document.getElementById('page-heading').textContent = t('heading');
      document.getElementById('page-description').textContent = t('description');
      document.getElementById('updates-heading').textContent = t('updates');
      langSvBtn.setAttribute('aria-pressed', String(language === 'sv'));
      langEnBtn.setAttribute('aria-pressed', String(language === 'en'));
      langSvBtn.textContent = '🇸🇪';
      langEnBtn.textContent = '🇬🇧';
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return '';
      }
      return date.toLocaleDateString(language === 'en' ? 'en-US' : 'sv-SE', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
      });
    }

    function renderNews(items) {
      newsList.innerHTML = '';

      if (!items.length) {
        newsList.innerHTML = `<p>${t('empty')}</p>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      items.forEach(item => {
        const article = document.createElement('article');
        article.className = 'news-item';

        const title = document.createElement('h3');
        title.textContent = item.title || t('fallbackTitle');
        article.appendChild(title);

        const dateText = formatDate(item.createdAt);
        if (dateText) {
          const date = document.createElement('p');
          date.className = 'news-date';
          date.textContent = dateText;
          article.appendChild(date);
        }

        const content = document.createElement('p');
        const lines = String(item.content || '').split('\n');
        lines.forEach((line, index) => {
          if (index > 0) {
            content.appendChild(document.createElement('br'));
          }
          content.appendChild(document.createTextNode(line));
        });
        article.appendChild(content);

        fragment.appendChild(article);
      });

      newsList.appendChild(fragment);
    }

    function setLanguage(nextLanguage) {
      if (!translations[nextLanguage]) {
        return;
      }
      language = nextLanguage;
      try {
        localStorage.setItem(LANGUAGE_KEY, language);
      } catch (_error) {
        // ignore
      }
      applyTranslations();
      if (Array.isArray(window.newsItems)) {
        renderNews(window.newsItems);
      }
    }

    async function loadNews() {
      try {
        const res = await fetch('/api/news');
        if (!res.ok) {
          throw new Error(t('fetchError'));
        }
        const items = await res.json();
        window.newsItems = items;
        renderNews(items);
      } catch (_error) {
        newsList.innerHTML = `<p>${t('loadError')}</p>`;
      }
    }

    try {
      const storedLanguage = localStorage.getItem(LANGUAGE_KEY);
      if (storedLanguage && translations[storedLanguage]) {
        language = storedLanguage;
      }
    } catch (_error) {
      language = 'sv';
    }

    langSvBtn.addEventListener('click', () => setLanguage('sv'));
    langEnBtn.addEventListener('click', () => setLanguage('en'));

    applyTranslations();
    loadNews();
  </script>
</body>
</html>
