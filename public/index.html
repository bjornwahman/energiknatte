<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Energiknatte – mellanmål för ADHD-hjärnor</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4447589580139887" crossorigin="anonymous"></script>
</head>
<body>
  <nav class="top-links" aria-label="Snabblänkar">
    <button class="top-links-toggle" type="button" aria-expanded="false" aria-controls="quick-links-menu">
      ☰ Snabblänkar
    </button>
    <div id="quick-links-menu" class="top-links-list">
      <a class="top-link-btn" href="/integritetspolicy.html">Integritetspolicy</a>
      <a class="top-link-btn" href="/om-oss.html">Om oss</a>
      <a class="top-link-btn" href="/nyheter.html">Nyheter</a>
      <a class="top-link-btn" href="/guider.html">Guider</a>
      <a class="top-link-btn" href="/lankar.html">Länkar</a>
    </div>
  </nav>

  <header class="hero">
    <div>
      <h1>Energiknatte</h1>
      <p class="subtitle">Snabba mellanmål med hjärnbränsle för barn med ADHD</p>
      <div class="cta-row">
        <button id="random-btn">Ge mig ett mellanmål!</button>
        <button id="favorites-toggle" type="button">Visa favoriter</button>
        <label class="search-field" for="recipe-search">
          Sök recept
          <input id="recipe-search" type="search" placeholder="Sök på namn eller ingrediens" />
        </label>
      </div>
    </div>
    <img src="/publiclogo-energiknatte-new.png" alt="Energiknatte logga" />
  </header>


  <section id="snack-grid" class="snack-grid" aria-live="polite"></section>

  <template id="snack-card-template">
    <article class="snack-card">
      <button class="favorite-btn" type="button" aria-label="Markera som favorit">♡</button>
      <p class="time"></p>
      <h2></h2>
      <p class="energy"></p>
      <p class="boost"></p>
      <ul class="ingredients"></ul>
      <h3>Gör så här</h3>
      <ol class="instructions"></ol>
    </article>
  </template>

  <aside id="cookie-banner" class="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookieinformation">
    <p>
      Vi använder cookies för att sidan ska fungera och för att förstå hur den används.
      Genom att klicka på "Jag godkänner" godkänner du detta.
    </p>
    <div class="cookie-actions">
      <a href="/integritetspolicy.html">Läs mer</a>
      <button id="cookie-accept" type="button">Jag godkänner</button>
    </div>
  </aside>

  <script src="/app.js" type="module"></script>
</body>
</html>
