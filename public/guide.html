<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guide – Energiknatte</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="info-page">
    <a class="back-link" href="/guider.html">← Tillbaka till guider</a>
    <article id="guide-content" class="news-item">
      <h1 id="guide-title">Guide</h1>
      <p id="guide-date" class="news-date"></p>
      <p id="guide-body">Laddar guide...</p>
    </article>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const guideId = params.get('id');
    const titleEl = document.getElementById('guide-title');
    const dateEl = document.getElementById('guide-date');
    const bodyEl = document.getElementById('guide-body');

    const formatDate = value => {
      const d = new Date(value);
      return Number.isNaN(d.getTime())
        ? ''
        : d.toLocaleDateString('sv-SE', { year: 'numeric', month: 'long', day: 'numeric' });
    };

    async function loadGuide() {
      if (!guideId) {
        titleEl.textContent = 'Guide saknas';
        bodyEl.textContent = 'Ingen guide är vald.';
        return;
      }

      try {
        const res = await fetch(`/api/guides/${encodeURIComponent(guideId)}`);
        if (!res.ok) {
          throw new Error('Kunde inte hämta guide');
        }

        const item = await res.json();
        titleEl.textContent = item.title || 'Guide';
        const dateText = formatDate(item.createdAt);
        dateEl.textContent = dateText;
        bodyEl.textContent = item.content || '';
        document.title = `${item.title || 'Guide'} – Energiknatte`;
      } catch (_error) {
        titleEl.textContent = 'Guide hittades inte';
        bodyEl.textContent = 'Guiden kunde inte laddas just nu.';
      }
    }

    loadGuide();
  </script>
</body>
</html>
