<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Länkar – Energiknatte</title>
  <link rel="stylesheet" href="/style.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4447589580139887" crossorigin="anonymous"></script>
</head>
<body>
  <main class="info-page">
    <div class="page-toolbar">
      <div class="language-switch" aria-label="Language selector">
        <button id="lang-sv" class="lang-btn" type="button" aria-label="Svenska" aria-pressed="true">🇸🇪</button>
        <button id="lang-en" class="lang-btn" type="button" aria-label="English" aria-pressed="false">🇬🇧</button>
      </div>
      <a id="back-link" class="back-link" href="/">Tillbaka</a>
    </div>
    <h1 id="page-heading">Länkar</h1>
    <p id="page-description">Här samlar vi användbara resurser och länkar som kan vara hjälpsamma för familjer.</p>

    <div id="links-list"></div>
  </main>

  <script>
    const LANGUAGE_KEY = 'siteLanguage';
    const linksList = document.getElementById('links-list');
    const langSvBtn = document.getElementById('lang-sv');
    const langEnBtn = document.getElementById('lang-en');

    const translations = {
      sv: {
        pageTitle: 'Länkar – Energiknatte',
        backLink: 'Tillbaka',
        heading: 'Länkar',
        description: 'Här samlar vi användbara resurser och länkar som kan vara hjälpsamma för familjer.',
        empty: 'Inga länkar publicerade ännu.',
        loadError: 'Kunde inte ladda länkar just nu.',
        fetchError: 'Kunde inte hämta länkar',
        fallbackTitle: 'Länk',
      },
      en: {
        pageTitle: 'Links – Energiknatte',
        backLink: 'Back',
        heading: 'Links',
        description: 'Here we collect helpful resources and links for families.',
        empty: 'No links have been published yet.',
        loadError: 'Could not load links right now.',
        fetchError: 'Could not fetch links',
        fallbackTitle: 'Link',
      },
    };

    let language = 'sv';

    function t(key) {
      return translations[language][key] || translations.sv[key] || key;
    }

    function applyTranslations() {
      document.documentElement.lang = language;
      document.title = t('pageTitle');
      document.getElementById('back-link').textContent = t('backLink');
      document.getElementById('page-heading').textContent = t('heading');
      document.getElementById('page-description').textContent = t('description');
      langSvBtn.setAttribute('aria-pressed', String(language === 'sv'));
      langEnBtn.setAttribute('aria-pressed', String(language === 'en'));
      langSvBtn.textContent = '🇸🇪';
      langEnBtn.textContent = '🇬🇧';
    }

    function render(items) {
      linksList.innerHTML = '';
      if (!items.length) {
        linksList.innerHTML = `<p>${t('empty')}</p>`;
        return;
      }

      const ul = document.createElement('ul');
      items.forEach(item => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = item.url || '#';
        a.textContent = item.title || item.url || t('fallbackTitle');
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        li.appendChild(a);
        if (item.description) {
          const desc = document.createElement('p');
          desc.className = 'news-date';
          desc.textContent = item.description;
          li.appendChild(desc);
        }
        ul.appendChild(li);
      });
      linksList.appendChild(ul);
    }

    function setLanguage(nextLanguage) {
      if (!translations[nextLanguage]) {
        return;
      }
      language = nextLanguage;
      try {
        localStorage.setItem(LANGUAGE_KEY, language);
      } catch (_error) {
        // ignore
      }
      applyTranslations();
      if (Array.isArray(window.linkItems)) {
        render(window.linkItems);
      }
    }

    async function loadLinks() {
      try {
        const res = await fetch('/api/links');
        if (!res.ok) throw new Error(t('fetchError'));
        const items = await res.json();
        window.linkItems = items;
        render(items);
      } catch (_error) {
        linksList.innerHTML = `<p>${t('loadError')}</p>`;
      }
    }

    try {
      const storedLanguage = localStorage.getItem(LANGUAGE_KEY);
      if (storedLanguage && translations[storedLanguage]) {
        language = storedLanguage;
      }
    } catch (_error) {
      language = 'sv';
    }

    langSvBtn.addEventListener('click', () => setLanguage('sv'));
    langEnBtn.addEventListener('click', () => setLanguage('en'));

    applyTranslations();
    loadLinks();
  </script>
</body>
</html>
